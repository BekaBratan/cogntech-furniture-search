name: Catalog and planner checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas openpyxl numpy
      - run: python -m py_compile app.py core.py catalog_io.py room_engine.py pages/1_Room_design.py
      - run: python -m unittest test_room_engine test_catalog_io -v
